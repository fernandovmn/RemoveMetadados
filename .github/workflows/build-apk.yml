name: Compilar APK Android ZeroMeta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Nativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle Wrapper
        working-directory: ./android_app
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Compilar APK (assembleDebug)
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear APK para ZeroMeta.apk
        run: |
          cp android_app/app/build/outputs/apk/debug/app-debug.apk ZeroMeta-Android.apk

      - name: Disponibilizar Download do APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ZeroMeta-Android-APK
          path: ZeroMeta-Android.apk
          retention-days: 30

      - name: Criar Release com Link Direto do APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ZeroMeta-Android.apk
          tag_name: v1.0.0
          name: ZeroMeta AI - Aplicativo Android Nativo (.apk)
          body: |
            ## 📱 ZeroMeta AI para Android (.APK Nativo)
            - **Sobrescreve fotos diretamente na pasta Pictures/ e DCIM/ sem duplicar na galeria!**
            - Remove C2PA da OpenAI, ChatGPT, Midjourney, Adobe Firefly, EXIF, GPS e Prompts.
            - Instalação direta no celular sem Google Play Store.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
