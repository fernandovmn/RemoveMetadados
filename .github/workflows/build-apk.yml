name: Compilar APK Android ZeroMeta

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Nativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar APK (assembleDebug)
        working-directory: ./android_app
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK para ZeroMeta.apk
        run: |
          cp android_app/app/build/outputs/apk/debug/app-debug.apk ZeroMeta-Android.apk

      - name: Disponibilizar Download do APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ZeroMeta-Android-APK
          path: ZeroMeta-Android.apk
          retention-days: 30
